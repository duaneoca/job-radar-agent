name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same hash-pinned bytes as the image (README › Pinned dependencies). pytest is test-only.
      - name: Install deps (hash-locked)
        run: |
          pip install --require-hashes -r requirements-build.lock
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation .
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  image:
    name: Image supply-chain check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t job-radar-agent:ci .
      - name: No startup hooks; litellm pinned
        run: |
          PIN=$(grep -oE '^litellm==[0-9.]+' requirements.lock)
          docker run --rm --entrypoint python -v "$PWD/scripts:/check:ro" job-radar-agent:ci \
            -I -S /check/check_site_packages.py --pin "$PIN"
